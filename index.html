<!doctype html>
<!-- Approvals page. Published with previews/ to a small public GitHub Pages repo; holds no private data or secrets.
     Open it with the link from `make approvals-link`: #api=...&key=... -->
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Studio approvals</title>
<style>
  :root { --bg: #f6f4ef; --fg: #1d1b18; --muted: #6b665d; --line: #d9d4c9; --card: #fff; --ok: #1f6b3a; --no: #9a2b22; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161513; --fg: #ece8df; --muted: #a29c90; --line: #34312c; --card: #1f1d1a; --ok: #6cc28c; --no: #ec8a80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 Georgia, "Times New Roman", serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 28px; font-weight: normal; margin: 0 0 4px; }
  h2 { font: 600 12px/1 system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 36px 0 12px; }
  .status { color: var(--muted); font: 14px system-ui, sans-serif; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 16px; margin-bottom: 12px; }
  .meta { font: 13px system-ui, sans-serif; color: var(--muted); margin-bottom: 8px; }
  pre { white-space: pre-wrap; word-break: break-word; font: 14px/1.55 ui-monospace, Menlo, Consolas, monospace; margin: 0; }
  input { width: 100%; font: 15px system-ui, sans-serif; padding: 10px; margin: 12px 0; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); }
  .row { display: flex; gap: 8px; }
  button { flex: 1; font: 600 15px system-ui, sans-serif; padding: 12px; border-radius: 4px; border: 1px solid currentColor; background: none; cursor: pointer; }
  .approve { color: var(--ok); } .reject { color: var(--no); }
  button:disabled { opacity: .4; cursor: default; }
  details summary { cursor: pointer; font: 600 15px system-ui, sans-serif; }
  details pre { margin-top: 12px; }
  h3 { font: 19px/1.3 Georgia, "Times New Roman", serif; margin: 0 0 4px; }
  .label { font: 600 12px/1 system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
  .was { color: var(--muted); text-decoration: line-through; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font: 14px system-ui, sans-serif; padding: 3px 9px; border: 1px solid var(--line); border-radius: 99px; }
  .tag.added { color: var(--ok); border-color: currentColor; }
  .tag.gone { color: var(--no); border-color: currentColor; text-decoration: line-through; }
  .text { white-space: pre-wrap; font: 15px/1.5 system-ui, sans-serif; margin: 8px 0 0; }
  .photos { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 12px -16px 0; padding: 0 16px 8px; }
  .photos a { flex: 0 0 88%; scroll-snap-align: center; }
  .photos img { display: block; width: 100%; aspect-ratio: 5 / 4; border: 1px solid var(--line); border-radius: 4px; }
  dl { margin: 12px 0 0; font: 15px system-ui, sans-serif; }
  dt { color: var(--muted); font-size: 13px; margin-top: 8px; }
  dd { margin: 0; word-break: break-word; }
  a { color: inherit; }
  .report { font: 15px/1.5 system-ui, sans-serif; overflow-wrap: anywhere; }
  .report h3 { margin: 16px 0 4px; }
  .report p { margin: 8px 0; }
  .report ul { margin: 8px 0; padding-left: 20px; }
  .report pre { overflow-x: auto; white-space: pre-wrap; }
  .live { display: inline-block; font: 14px system-ui, sans-serif; margin-top: 2px; }
</style>
</head>
<body>
<main>
  <h1>Studio approvals</h1>
  <p class="status" id="status">Loading…</p>
  <h2>Waiting on you</h2>
  <div id="pending"></div>
  <h2>Latest reports</h2>
  <div id="reports"></div>
</main>
<script>
let params, api, key;
// Chat apps sometimes turn & into &amp; when a link is copied, so undo that before reading it.
const readLink = () => { params = new URLSearchParams(location.hash.slice(1).replaceAll("&amp;", "&")); api = params.get("api"); key = params.get("key"); };
readLink();
addEventListener("hashchange", () => { readLink(); load(); });  // a newer link opened in an already open tab
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const when = (t) => new Date(t).toLocaleString("en-AU", { dateStyle: "medium", timeStyle: "short" });

async function call(method, body) {
  const r = await fetch(api, { method, headers: { "x-approvals-key": key, "content-type": "application/json" }, body: body && JSON.stringify(body) });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
  return r.json();
}

const KINDS = { copy_fix: "New words", photos: "New photos", price: "Price change", archive: "Deactivate", section_move: "Move to a shop section" };
const listingLink = (id) => { const l = el("a", "live", "See the listing on Etsy"); l.href = `https://www.etsy.com/listing/${Number(id)}`; l.target = "_blank"; l.rel = "noopener"; return l; };
const section = (label, ...body) => { const s = el("div"); s.append(el("div", "label", label), ...body); return s; };
const fold = (label, text) => { const d = el("details"); d.append(el("summary", "meta", label), el("p", "text", text)); return d; };

function tagChips(now, was) {
  const box = el("div", "tags");
  for (const t of now) box.append(el("span", was && !was.includes(t) ? "tag added" : "tag", t));
  for (const t of (was || []).filter((t) => !now.includes(t))) box.append(el("span", "tag gone", t));
  return box;
}

// What the approval does, in words. Anything without its own layout falls back to a plain list of its details.
function details(a) {
  const r = a.ref, was = r.before || {}, parts = [];
  if (r.title) parts.push(el("h3", null, r.title));
  if (r.etsy_listing_id) parts.push(listingLink(r.etsy_listing_id));
  if (a.kind === "photos") {
    const row = el("div", "photos");
    for (let n = 1; n <= 10; n++) {
      const src = `previews/${Number(r.etsy_listing_id)}/${String(n).padStart(2, "0")}.jpg`;
      const link = el("a"), img = el("img");
      link.href = src; link.target = "_blank"; img.src = src; img.loading = "lazy"; img.alt = `New photo ${n} of 10`;
      link.append(img); row.append(link);
    }
    parts.push(section("Swipe to see all 10 new photos", row));
    if (r.alt) parts.push(section("Description for each photo", el("p", "text", r.alt)));
  } else if (a.kind === "copy_fix") {
    if (r.new_title) {
      const box = el("div");
      if (was.title) box.append(el("p", "text was", was.title));
      box.append(el("p", "text", r.new_title));
      parts.push(section("New title", box));
    }
    if (r.tags) parts.push(section(was.tags ? "Tags: green is new, red is removed" : "New tags", tagChips(r.tags, was.tags)));
    if (r.description) {
      const box = el("div");
      box.append(fold("Read the new description", r.description));
      if (was.description) box.append(fold("Read the current description", was.description));
      parts.push(section("New description", box));
    }
    if (r.alt) parts.push(section("New description for each photo", el("p", "text", r.alt)));
  } else {
    const list = el("dl");
    for (const [k, v] of Object.entries(r)) {
      if (["title", "listing_id", "etsy_listing_id"].includes(k)) continue;
      list.append(el("dt", null, k.replaceAll("_", " ")), el("dd", null, typeof v === "object" ? JSON.stringify(v) : String(v)));
    }
    parts.push(list);
    if (a.note) parts.push(el("p", null, a.note));
  }
  return parts;
}

function pendingCard(a) {
  const card = el("div", "card");
  card.append(el("div", "meta", `#${a.id} · ${KINDS[a.kind] || a.kind} · ${when(a.created_at)}`), ...details(a));
  const note = el("input"); note.placeholder = "Note (optional)";
  const row = el("div", "row");
  for (const [label, decision] of [["Approve", "approved"], ["Reject", "rejected"]]) {
    const b = el("button", decision === "approved" ? "approve" : "reject", label);
    b.onclick = async () => {
      row.querySelectorAll("button").forEach((x) => (x.disabled = true));
      try { await call("POST", { id: a.id, decision, note: note.value }); card.replaceChildren(el("div", "meta", `#${a.id} ${decision}.`)); }
      catch (e) { $("status").textContent = `Could not save: ${e.message}`; row.querySelectorAll("button").forEach((x) => (x.disabled = false)); }
    };
    row.append(b);
  }
  card.append(note, row);
  return card;
}

// Reports are written in Markdown: enough of it here for them to read as a document, with everything set as text, never HTML.
function inline(line) {
  const p = el("span");
  line.split("**").forEach((part, i) => p.append(i % 2 ? el("strong", null, part) : part));
  return p;
}

function reportBody(md) {
  const box = el("div", "report");
  let list = null, code = null;
  for (const line of md.split("\n")) {
    if (line.startsWith("```")) { if (code) { code = null; } else { code = el("pre"); box.append(code); } list = null; continue; }
    if (code) { code.append(line + "\n"); continue; }
    const bullet = line.match(/^\s*[*-]\s+(.*)/), head = line.match(/^#+\s+(.*)/);
    if (bullet) { if (!list) { list = el("ul"); box.append(list); } const li = el("li"); li.append(inline(bullet[1])); list.append(li); continue; }
    list = null;
    if (head) box.append(el("h3", null, head[1]));
    else if (line.trim()) { const para = el("p"); para.append(inline(line)); box.append(para); }
  }
  return box;
}

async function load() {
  if (!api || !key) {
    $("status").textContent = !location.hash
      ? "This address has no key. Open the full link from your email, or run make approvals-link and paste all of it, including everything after #."
      : `This link is incomplete: it is missing ${!api ? "the api part" : "the key part"}. Copy the whole link again.`;
    return;
  }
  try {
    const { reports, pending } = await call("GET");
    $("status").textContent = `Updated ${when(Date.now())}`;
    $("pending").replaceChildren(...(pending.length ? pending.map(pendingCard) : [el("p", "status", "Nothing to approve.")]));
    $("reports").replaceChildren(...(reports.length ? reports.map((r) => {
      const d = el("details", "card"); d.open = r.kind === "scan";
      d.append(el("summary", null, `${r.kind} · ${when(r.created_at)}`), reportBody(r.body_md));
      return d;
    }) : [el("p", "status", "No reports yet.")]));
  } catch (e) { $("status").textContent = e.message === "forbidden" ? "This link is not valid. Use the latest one from your email." : `Could not load: ${e.message}`; }
}
load();
</script>
</body>
</html>
